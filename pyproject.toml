[project]
name = "tradeup"
version = "0.1.0"
description = "Graph-aware stock ranking and allocation for NSE"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.4",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "scikit-learn",
    "scipy==1.18.0",
    "tabulate",
    "yfinance==1.5.2",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
